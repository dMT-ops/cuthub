<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0b323" />

    <!-- PWA: o manifest e o que faz o Chrome oferecer "Adicionar a tela
         inicial"; o apple-touch-icon e o que o iOS usa, porque o Safari
         ignora os icones do manifest. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CutHub" />

    <title>CutHub — Gestão completa para barbearias</title>
    <meta
      name="description"
      content="Agenda, clientes, equipe, serviços e financeiro da sua barbearia em um só lugar. Crie a conta e organize o atendimento em minutos."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CutHub" />
    <meta property="og:title" content="CutHub — Gestão completa para barbearias" />
    <meta
      property="og:description"
      content="Agenda, clientes, equipe, serviços e financeiro da sua barbearia em um só lugar."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
